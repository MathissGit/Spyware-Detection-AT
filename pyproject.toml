[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "integration: tests d'intégration réels (nécessitent un environnement complet)",
    "real_android: tests d'intégration nécessitant un appareil Android branché (auto-skip sinon)",
    "real_ios: tests d'intégration nécessitant un appareil iOS branché (auto-skip sinon)",
]

[tool.coverage.run]
source = ["main", "gui", "scripts"]
omit = [
    "*/__pycache__/*",
    "tests/*",
    ".venv_forensics/*",
    ".venv_tests/*",
    "mvt_iocs/*",
]

[tool.coverage.report]
show_missing = true
# Couverture obligatoire à 100 % : aucune ligne du code livré n'est
# tolérée sans test (voir TEST_STRATEGY.md pour le barème 3 niveaux).
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__",
    "pass",
]
